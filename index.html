<!DOCTYPE html>

<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知鸟导航</title>
    <link rel="icon" href="https://sapphira0313.github.io/Zhiniao-Navigation/icon-16x16.ico" type="image/x-icon">
    <link rel="shortcut icon" href="https://sapphira0313.github.io/Zhiniao-Navigation/icon-16x16.ico" type="image/x-icon">
    <!-- Bootstrap CSS -->
    <link href="./知鸟导航_files/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="./知鸟导航_files/all.min.css">
    <style>
        :root {
            /* Color Tokens */
            --color-primary-100: #f0f9ff;
            --color-primary-500: #3b82f6;
            --color-primary-600: #2563eb;
            --color-primary-900: #1e3a8a;
            
            --color-secondary-100: #f3f4f6;
            --color-secondary-300: #d1d5db;
            --color-secondary-500: #6b7280;
            --color-secondary-600: #4b5563;
            --color-secondary-900: #111827;
            
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --color-info: #3b82f6;
            
            --color-white: #ffffff;
            --color-light-bg: #f8f9fa;
            --color-dark-bg: #1a1a2e;
            --color-card-bg: #ffffff;
            --color-text-dark: #111827;
            --color-text-light: #f3f4f6;
            
            /* Legacy variable aliases for backward compatibility */
            --light-bg: var(--color-light-bg);
            --dark-bg: var(--color-dark-bg);
            --text-dark: var(--color-text-dark);
            --card-bg: var(--color-card-bg);
            --primary-color: var(--color-primary-500);
            --secondary-color: var(--color-secondary-500);
            
            /* Typography Tokens */
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 1.875rem;
            --font-size-4xl: 2.25rem;
            --font-size-5xl: 3rem;
            --font-size-6xl: 3.75rem;
            
            /* Spacing Tokens */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
            --space-16: 4rem;
            
            /* Shadow Tokens */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            
            /* Transition Tokens */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Border Radius Tokens */
            --radius-sm: 0.25rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;
            --radius-xl: 0.75rem;
            --radius-2xl: 1rem;
            --radius-full: 9999px;
            
            /* Z-index Tokens */
            --z-dropdown: 1000;
            --z-modal: 10000;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-light-bg);
            color: var(--color-text-dark);
            min-height: 100vh;
            padding: var(--space-6);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: all var(--transition-normal);
        }

        /* 顶部区域 */
        .top-section {
            max-width: 1200px;
            margin: 0 auto var(--space-8);
            text-align: center;
            position: relative;
        }

        /* 时钟样式 */
        .clock-container {
            margin-bottom: 0;
        }

        .time {
            font-size: var(--font-size-6xl);
            font-weight: 700;
            color: white;
            margin-bottom: -15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .date {
            font-size: var(--font-size-base);
            color: white;
            opacity: 0.8;
            margin-top: 10px;
            margin-bottom: var(--space-8);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* 搜索框 */
        .search-container {
            max-width: 600px;
            margin: 0 auto var(--space-6);
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: var(--space-4) var(--space-16) var(--space-4) var(--space-12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-full);
            font-size: var(--font-size-base);
            outline: none;
            transition: all var(--transition-normal);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(10px);
        }

        [data-theme="dark"] .search-input {
            background: rgba(30, 30, 46, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .search-input:focus {
            border-color: var(--color-primary-500);
            box-shadow: none;
        }

        .search-btn {
            position: absolute;
            right: 5px;
            background: transparent;
            color: white;
            border: none;
            border-radius: var(--radius-full);
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: all var(--transition-normal);
            flex-shrink: 0;
            z-index: var(--z-dropdown);
        }

        .search-btn:hover {
            background: var(--color-secondary-300);
            transform: scale(1.05);
        }

        /* 搜索引擎图标 */
        .search-engine-icon {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            cursor: pointer;
            z-index: var(--z-dropdown);
        }
        
        .engine-icon-img {
            width: 100%;
            height: 100%;
            border-radius: var(--radius-sm);
        }
        
        /* 搜索引擎选择器 */
        .engine-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: var(--space-3) 0;
            box-shadow: var(--shadow-lg);
            z-index: var(--z-modal);
            display: table;
            table-layout: fixed;
        }
        
        [data-theme="dark"] .engine-dropdown {
            background: rgba(30, 30, 46, 0.9);
        }
        
        .engine-option {
            display: table-cell;
            padding: var(--space-3) 0;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background var(--transition-fast);
            text-align: center;
            vertical-align: middle;
            width: 25%;
        }
        
        .engine-option:hover {
            background: rgba(59, 130, 246, 0.1);
        }
        
        .engine-option img {
            width: 20px;
            height: 20px;
            margin: 0 auto var(--space-2);
            display: block;
            border-radius: var(--radius-sm);
        }
        
        .engine-option span {
            font-size: var(--font-size-sm);
            color: var(--color-text-dark);
            display: block;
        }
        
        [data-theme="dark"] .engine-option span {
            color: var(--color-text-light);
        }

        /* 分组标题容器 */
        .group-title-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: var(--space-1);
            position: relative;
            width: 100%;
        }

        /* 分组标题拖拽样式 */
        .group-title {
            font-size: var(--font-size-xl);
            font-weight: 600;
            margin: var(--space-1) 0 var(--space-1);
            padding: var(--space-2) var(--space-3);
            color: white;
            cursor: move;
            border-radius: var(--radius-md);
            transition: background-color var(--transition-normal);
            text-align: left;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .group-title:hover {
            background-color: rgba(59, 130, 246, 0.2);
        }

        .group-title.dragging {
            opacity: 0.6;
            background-color: rgba(59, 130, 246, 0.3);
        }

        .group-title.drag-over {
            border: 2px dashed var(--color-primary-600);
            background-color: rgba(59, 130, 246, 0.1);
        }

        [data-theme="dark"] .group-title {
            color: var(--color-text-light);
        }

        /* 分组删除按钮样式 */
        .group-delete-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            font-size: var(--font-size-sm);
            margin-left: var(--space-2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .group-delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--color-error);
        }

        [data-theme="dark"] .group-delete-btn {
            color: rgba(255, 255, 255, 0.6);
        }

        [data-theme="dark"] .group-delete-btn:hover {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--color-error);
        }

        /* 添加分组按钮样式 */
        .add-group-container {
            text-align: center;
            margin-top: var(--space-6);
            margin-bottom: var(--space-6);
        }

        .add-group-btn {
            padding: var(--space-3) var(--space-6);
            font-size: var(--font-size-base);
            font-weight: 500;
            background: transparent;
            border: none;
            color: white;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all var(--transition-normal);
            backdrop-filter: blur(10px);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
        }

        .add-group-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        [data-theme="dark"] .add-group-btn {
            color: white;
        }

        /* 网格布局 */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: var(--space-2);
            margin-bottom: var(--space-2);
        }

        /* 导航项 */
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            padding: var(--space-3) var(--space-2);
            background: transparent;
            border-radius: 0;
            transition: all var(--transition-normal);
            box-shadow: none;
            cursor: move;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        [data-theme="dark"] .nav-item {
            color: var(--color-text-light);
            box-shadow: none;
            background: transparent;
        }

        .nav-item:hover {
            transform: translateY(-5px);
            box-shadow: none;
            background: transparent;
        }

        [data-theme="dark"] .nav-item:hover {
            box-shadow: none;
            background: transparent;
        }

        /* 拖拽样式 */
        .nav-item.dragging {
            opacity: 0.5;
            background: rgba(59, 130, 246, 0.3);
        }

        .nav-item.drag-over {
            border: 2px dashed var(--color-primary-600);
        }

        /* 隐藏拖拽时的焦点轮廓 */
        .nav-item:focus,
        .nav-item:active,
        .nav-item::-moz-focus-inner {
            outline: none !important;
            outline-offset: 0 !important;
            border: 0 !important;
        }

        /* 针对拖拽元素的特殊处理 */
        .nav-item[draggable="true"] {
            -webkit-user-drag: element;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* 确保在拖拽过程中不显示任何轮廓 */
        .nav-item.dragging:focus,
        .nav-item.drag-over:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        .nav-icon {
            width: 34px;
            height: 34px;
            margin-bottom: var(--space-2);
            border-radius: var(--radius-md);
            object-fit: contain;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            transition: opacity var(--transition-normal);
            opacity: 1;
        }
        
        .nav-icon.loaded {
            opacity: 1;
        }

        .nav-name {
            font-size: var(--font-size-sm);
            text-align: center;
            word-break: break-word;
            max-width: 90px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 500;
        }

        /* 添加按钮 */
        .add-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-3) var(--space-2) var(--space-2) var(--space-2);
            background: transparent;
            border: none;
            border-radius: var(--radius-lg);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all var(--transition-normal);
            min-height: auto;
            opacity: 0.85;
            position: relative;
        }

        [data-theme="dark"] .add-btn {
            color: rgba(255, 255, 255, 0.7);
            opacity: 0.85;
        }

        .add-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: none;
            opacity: 1;
        }

        [data-theme="dark"] .add-btn:hover {
            background: rgba(76, 201, 240, 0.1);
            opacity: 1;
        }

        /* 使用 CSS 伪元素创建加号 */
        .add-btn::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 3px;
            background-color: white;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.7);
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
        }

        .add-btn::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 18px;
            background-color: white;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.7);
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        [data-theme="light"] .add-btn::before,
        [data-theme="light"] .add-btn::after {
            background-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
        }

        .add-btn .nav-name {
            font-size: var(--font-size-sm);
            text-align: center;
            word-break: break-word;
            max-width: 90px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 20px;
        }

        /* 底部控制 */
        .bottom-controls {
            max-width: 1200px;
            margin: var(--space-12) auto 0;
            display: flex;
            justify-content: center;
            gap: var(--space-4);
            flex-wrap: wrap;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: var(--radius-full);
            padding: var(--space-3) var(--space-6);
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            transition: all var(--transition-normal);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            box-shadow: var(--shadow-sm);
            backdrop-filter: blur(10px);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        [data-theme="dark"] .control-btn {
            background: rgba(30, 30, 46, 0.3);
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-sm);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        [data-theme="dark"] .control-btn:hover {
            box-shadow: var(--shadow-md);
        }

        /* 右下角固定按钮特殊样式 */
        .control-btn.fixed-bottom {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            border-radius: var(--radius-full);
            padding: var(--space-3);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            user-select: none;
            -webkit-user-select: none;
            transition: all var(--transition-normal);
            will-change: transform;
        }
        
        .control-btn.fixed-bottom svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            shape-rendering: geometricPrecision;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }
        
        .control-btn.fixed-bottom:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: var(--shadow-lg);
            background: rgba(255, 255, 255, 0.35);
            will-change: transform;
        }

        [data-theme="dark"] .control-btn.fixed-bottom:hover {
            background: rgba(30, 30, 46, 0.6);
            box-shadow: var(--shadow-lg);
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: var(--z-modal);
        }
        
        .modal-content {
            color: var(--color-text-dark);
        }
        
        [data-theme="dark"] .modal-content {
            color: var(--color-text-light);
        }

        .modal.show {
            display: flex;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        [data-theme="dark"] .modal-content {
            background: rgba(30, 30, 46, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: var(--shadow-xl);
        }

        .modal-header {
            padding: var(--space-6);
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        [data-theme="dark"] .modal-header {
            border-bottom: 1px solid #495057;
        }

        .modal-title {
            margin: 0;
            font-size: var(--font-size-lg);
            font-weight: 600;
            color: var(--color-text-dark);
        }
        
        [data-theme="dark"] .modal-title {
            color: var(--color-text-light);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
        }

        .modal-close:hover {
            color: #6b7280;
        }

        [data-theme="dark"] .modal-close:hover {
            color: #d1d5db;
        }

        .modal-body {
            padding: var(--space-6);
        }

        .modal-footer {
            padding: var(--space-6);
            border-top: 1px solid #e9ecef;
            display: flex;
            justify-content: flex-end;
            gap: var(--space-3);
        }

        [data-theme="dark"] .modal-footer {
            border-top: 1px solid #495057;
        }

        .btn {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            font-weight: 500;
            cursor: pointer;
            border: none;
            color: var(--color-text-dark);
        }
        
        [data-theme="dark"] .btn {
            color: var(--color-text-light);
        }

        .btn-primary {
            background: var(--color-primary-500);
            color: white;
        }

        .btn-primary:hover {
            background: var(--color-primary-600);
        }

        .btn-secondary {
            background: var(--color-secondary-500);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--color-secondary-600, #5a6268);
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-danger:hover {
            background: #bb2d3b;
        }

        .form-group {
            margin-bottom: var(--space-6);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-weight: 500;
            font-size: var(--font-size-sm);
            color: var(--color-text-dark);
        }
        
        [data-theme="dark"] .form-label {
            color: var(--color-text-light);
        }

        .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 1px solid #d1d5db;
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
            box-sizing: border-box;
            background: var(--color-card-bg);
            color: var(--color-text-dark);
        }

        [data-theme="dark"] .form-control {
            border: 1px solid #495057;
            color: var(--color-text-light);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-primary-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        // 获取 Bing 每日一图

            try {

                        url: `https://www.bing.com${img.url}`,
                        copyright: img.copyright,
                        date: img.enddate

                    return bingWallpapers;

                console.error('获取 Bing 壁纸失败:', error);

                    e.preventDefault();
                    e.stopPropagation();
                    openEditGroupNameModal(group.id);
                };
                
                titleContainer.appendChild(title);
                
                // 添加删除按钮（至少保留一个分组）
                if (websiteGroups.length > 1) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'group-delete-btn';
                    deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                    deleteBtn.title = '删除分组';
                    deleteBtn.style.position = 'absolute';
                    deleteBtn.style.right = '10px';
                    deleteBtn.style.top = '50%';
                    deleteBtn.style.transform = 'translateY(-50%)';
                    
                    deleteBtn.onclick = function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        openEditGroupModal(groupIndex);
                    };
                    
                    titleContainer.appendChild(deleteBtn);
                }
                
                container.appendChild(titleContainer);

                // 网站网格
                const grid = document.createElement('div');
                grid.className = 'nav-grid';

                group.websites.forEach((site, index) => {
                    const item = document.createElement('a');
                    item.href = site.url;
                    item.className = 'nav-item';
                    item.target = '_blank';
                    item.dataset.groupId = group.id;
                    item.dataset.index = index;
                    item.draggable = true;
                    item.setAttribute('hidefocus', 'true');
                    item.style.outline = 'none';
                    item.style.webkitTapHighlightColor = 'transparent';
                    
                    item.innerHTML = `
                        <img src="${site.icon}" alt="${site.name}" class="nav-icon" onerror="this.src='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/icons/globe.svg'">
                        <div class="nav-name">${site.name}</div>
                    `;

                    item.oncontextmenu = function(e) {
                        e.preventDefault();
                        openEditWebsiteModal(group.id, index);
                    };

                    item.addEventListener('dragstart', handleDragStart);
                    item.addEventListener('dragover', handleDragOver);
                    item.addEventListener('dragenter', handleDragEnter);
                    item.addEventListener('dragleave', handleDragLeave);
                    item.addEventListener('drop', handleDrop);
                    item.addEventListener('dragend', handleDragEnd);

                    grid.appendChild(item);
                });

                // 添加网站按钮
                const addButton = document.createElement('button');
                addButton.className = 'add-btn';
                addButton.innerHTML = '<div class="nav-name">添加网站</div>';
                addButton.onclick = () => openAddWebsiteModal(group.id);
                grid.appendChild(addButton);

                container.appendChild(grid);
            });
            
            // 添加"添加分组"按钮（始终在最后一个分组下面）
            const addGroupContainer = document.createElement('div');
            addGroupContainer.className = 'add-group-container';
            
            const addGroupButton = document.createElement('button');
            addGroupButton.className = 'add-group-btn';
            addGroupButton.innerHTML = '<i class="fas fa-plus"></i> 添加分组';
            addGroupButton.onclick = function() {
                openAddGroupModal();
            };
            
            addGroupContainer.appendChild(addGroupButton);
            container.appendChild(addGroupContainer);
            
            // 重新初始化分组拖拽功能
            setTimeout(initGroupDragAndDrop, 100);
        }

        // 打开模态框
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('show');
        }

        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        // 打开添加网站模态框
        function openAddWebsiteModal(groupId) {
            currentEditGroup = groupId;
            document.getElementById('websiteUrl').value = '';
            document.getElementById('websiteName').value = '';
            openModal('addWebsiteModal');
        }

        // 打开编辑网站模态框
        function openEditWebsiteModal(groupId, index) {
            currentEditGroup = groupId;
            currentEditIndex = index;
            const group = websiteGroups.find(g => g.id === groupId);
            if (!group) return;
            const site = group.websites[index];
            
            document.getElementById('editName').value = site.name;
            document.getElementById('editUrl').value = site.url;
            document.getElementById('editIcon').value = site.icon || '';
            
            const groupSelect = document.getElementById('editGroup');
            groupSelect.innerHTML = '';
            websiteGroups.forEach(g => {
                const option = document.createElement('option');
                option.value = g.id;
                option.textContent = g.name;
                if (g.id === groupId) {
                    option.selected = true;
                }
                groupSelect.appendChild(option);
            });
            

            
            openModal('editWebsiteModal');
        }

        // 打开添加分组模态框
        function openAddGroupModal() {
            document.getElementById('groupName').value = '';
            openModal('addGroupModal');
        }

        // 打开编辑分组模态框
        function openEditGroupModal(groupIndex) {
            currentEditGroup = groupIndex;
            openModal('editGroupModal');
        }

        // 打开编辑分组名称模态框
        function openEditGroupNameModal(groupId) {
            const group = websiteGroups.find(g => g.id === groupId);
            if (!group) return;
            currentEditGroup = groupId;
            document.getElementById('newGroupName').value = group.name;
            openModal('editGroupNameModal');
        }

        // 保存分组名称编辑
        function saveGroupNameEdit() {
            const newName = document.getElementById('newGroupName').value.trim();
            if (!newName) {
                alert('请输入分组名称');
                return;
            }
            
            const group = websiteGroups.find(g => g.id === currentEditGroup);
            if (group) {
                group.name = newName;
                saveWebsites();
                renderGroups();
            }
            
            closeModal('editGroupNameModal');
        }

        // 添加分组
        function addGroup() {
            const groupName = document.getElementById('groupName').value.trim();
            if (!groupName) {
                alert('请输入分组名称');
                return;
            }
            
            const newGroup = {
                id: 'group' + Date.now(),
                name: groupName,
                websites: []
            };
            
            websiteGroups.push(newGroup);
            saveWebsites();
            renderGroups();
            closeModal('addGroupModal');
        }

        // 删除分组
        function deleteGroup() {
            if (websiteGroups.length <= 1) {
                alert('至少保留一个分组');
                return;
            }
            
            websiteGroups.splice(currentEditGroup, 1);
            saveWebsites();
            renderGroups();
            closeModal('editGroupModal');
        }

        // 添加网站
        async function addWebsite() {
            const url = document.getElementById('websiteUrl').value.trim();
            const name = document.getElementById('websiteName').value.trim();
            
            if (!url || !name) {
                alert('请输入完整的网站信息');
                return;
            }
            
            const group = websiteGroups.find(g => g.id === currentEditGroup);
            if (!group) return;
            
            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }
            
            const newSite = {
                id: 'site' + Date.now(),
                name: name,
                url: finalUrl,
                icon: await getWebsiteIcon(finalUrl)
            };
            
            group.websites.push(newSite);
            saveWebsites();
            renderGroups();
            closeModal('addWebsiteModal');
        }

        // 保存网站编辑
        async function saveWebsiteEdit() {
            const name = document.getElementById('editName').value.trim();
            const url = document.getElementById('editUrl').value.trim();
            const icon = document.getElementById('editIcon').value.trim();
            const targetGroupId = document.getElementById('editGroup').value;
            
            if (!name || !url) {
                alert('请输入完整的网站信息');
                return;
            }
            
            // 验证图标URL格式（如果提供了图标）
            if (icon) {
                const allowedExtensions = ['.jpg', '.jpeg', '.gif', '.webp', '.avif', '.png', '.svg', '.ico'];
                const lowerIcon = icon.toLowerCase();
                
                // 检查是否以允许的扩展名结尾
                const hasValidExtension = allowedExtensions.some(ext => lowerIcon.endsWith(ext));
                
                // 检查是否是有效的URL格式
                const isValidUrl = /^(https?:\/\/)/.test(icon);
                
                if (!isValidUrl || !hasValidExtension) {
                    alert('请输入有效的图标URL，支持jpg、jpeg、gif、webp、avif、png、svg、ico格式');
                    return;
                }
            }
            
            const oldGroup = websiteGroups.find(g => g.id === currentEditGroup);
            if (!oldGroup) return;
            
            const site = oldGroup.websites[currentEditIndex];
            site.name = name;
            site.url = url;
            site.icon = icon || await getWebsiteIcon(url);
            
            if (targetGroupId !== currentEditGroup) {
                const newGroup = websiteGroups.find(g => g.id === targetGroupId);
                if (newGroup) {
                    oldGroup.websites.splice(currentEditIndex, 1);
                    newGroup.websites.push(site);
                }
            }
            
            saveWebsites();
            renderGroups();
            closeModal('editWebsiteModal');
        }

        // 删除网站
        function deleteWebsite() {
            const group = websiteGroups.find(g => g.id === currentEditGroup);
            if (!group) return;
            
            group.websites.splice(currentEditIndex, 1);
            saveWebsites();
            renderGroups();
            closeModal('editWebsiteModal');
        }

        // 获取网站图标（使用Google的favicon服务避免跨域问题）
        async function getWebsiteIcon(url) {
            try {
                const urlObj = new URL(url);
                const domain = urlObj.hostname;
                const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                
                const img = new Image();
                img.src = iconUrl;
                
                return new Promise((resolve) => {
                    const timeout = setTimeout(() => {
                        resolve('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/icons/globe.svg');
                    }, 2000);
                    
                    img.onload = () => {
                        clearTimeout(timeout);
                        resolve(iconUrl);
                    };
                    
                    img.onerror = () => {
                        clearTimeout(timeout);
                        resolve('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/icons/globe.svg');
                    };
                });
            } catch (error) {
                return 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/icons/globe.svg';
            }
        }

        // 搜索引擎切换
        function toggleEngineDropdown() {
            const dropdown = document.getElementById('engineDropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        function selectEngine(engine) {
            currentSearchEngine = engine;
            const currentEngine = searchEngines[engine];
            document.getElementById('currentEngineIcon').src = currentEngine.favicon;
            document.getElementById('engineDropdown').style.display = 'none';
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            const engine = searchEngines[currentSearchEngine];
            const searchUrl = engine.url + encodeURIComponent(query);
            window.open(searchUrl, '_blank');
        }

        // 拖拽功能
        let dragSrcElement = null;

        function handleDragStart(e) {
            dragSrcElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (dragSrcElement !== this) {
                const srcGroupId = dragSrcElement.dataset.groupId;
                const srcIndex = parseInt(dragSrcElement.dataset.index);
                const targetGroupId = this.dataset.groupId;
                const targetIndex = parseInt(this.dataset.index);

                const srcGroup = websiteGroups.find(g => g.id === srcGroupId);
                const targetGroup = websiteGroups.find(g => g.id === targetGroupId);

                if (srcGroup && targetGroup) {
                    const draggedSite = srcGroup.websites[srcIndex];
                    
                    if (srcGroupId === targetGroupId) {
                        srcGroup.websites.splice(srcIndex, 1);
                        srcGroup.websites.splice(targetIndex, 0, draggedSite);
                    } else {
                        srcGroup.websites.splice(srcIndex, 1);
                        targetGroup.websites.splice(targetIndex, 0, draggedSite);
                    }

                    saveWebsites();
                    renderGroups();
                }
            }

            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }

        // 分组拖拽功能
        function initGroupDragAndDrop() {
            const titles = document.querySelectorAll('.group-title');
            titles.forEach(title => {
                title.addEventListener('dragstart', handleGroupDragStart);
                title.addEventListener('dragover', handleGroupDragOver);
                title.addEventListener('dragenter', handleGroupDragEnter);
                title.addEventListener('dragleave', handleGroupDragLeave);
                title.addEventListener('drop', handleGroupDrop);
                title.addEventListener('dragend', handleGroupDragEnd);
            });
        }

        let dragSrcGroupElement = null;

        function handleGroupDragStart(e) {
            dragSrcGroupElement = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleGroupDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            return false;
        }

        function handleGroupDragEnter(e) {
            const titleContainer = this.closest('.group-title-container');
            if (titleContainer && dragSrcGroupElement !== this) {
                titleContainer.classList.add('drag-over');
            }
        }

        function handleGroupDragLeave(e) {
            const titleContainer = this.closest('.group-title-container');
            if (titleContainer) {
                titleContainer.classList.remove('drag-over');
            }
        }

        function handleGroupDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (dragSrcGroupElement !== this) {
                const srcGroupId = dragSrcGroupElement.dataset.groupId;
                const targetGroupId = this.dataset.groupId;

                const srcIndex = websiteGroups.findIndex(g => g.id === srcGroupId);
                const targetIndex = websiteGroups.findIndex(g => g.id === targetGroupId);

                if (srcIndex !== -1 && targetIndex !== -1) {
                    const draggedGroup = websiteGroups[srcIndex];
                    websiteGroups.splice(srcIndex, 1);
                    websiteGroups.splice(targetIndex, 0, draggedGroup);

                    saveWebsites();
                    renderGroups();
                }
            }

            return false;
        }

        function handleGroupDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.group-title-container').forEach(container => {
                container.classList.remove('drag-over');
            });
        }

        // 壁纸预览功能
        function showWallpaperPreview() {
            // 默认壁纸列表（始终可用）
            const defaultWallpapers = [
                { url: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' },
                { url: 'https://images.unsplash.com/photo-1477346611705-65d1883cee1e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' },
                { url: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' },
                { url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' }
            ];
            
            if (bingWallpapers.length === 0) {
                // 如果 Bing 壁纸未加载，使用默认壁纸
                const nextIndex = (currentWallpaperIndex + 1) % defaultWallpapers.length;
                setWallpaper(defaultWallpapers[nextIndex].url);
            } else {
                // 使用 Bing 壁纸
                const nextIndex = (currentWallpaperIndex + 1) % bingWallpapers.length;
                setBingWallpaper(nextIndex);
            }
        }
        
        // 设置壁纸（通用函数）
        function setWallpaper(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            document.body.style.backgroundAttachment = 'fixed';
            
            currentWallpaperIndex++;
            localStorage.setItem('backgroundImage', `url('${url}')`);
            localStorage.setItem('backgroundIndex', currentWallpaperIndex);
        }

        // 初始化
        function init() {
            initClock();
            loadWebsites();
            initWebsitePositions();
            renderGroups();
            
            const currentEngine = searchEngines[currentSearchEngine];
            if (currentEngine) {
                document.getElementById('currentEngineIcon').src = currentEngine.favicon;
            }
            
            // 设置默认壁纸（立即显示）
            const defaultWallpapers = [
                { url: 'https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' },
                { url: 'https://images.unsplash.com/photo-1477346611705-65d1883cee1e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' },
                { url: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' },
                { url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&h=1080&q=80' }
            ];
            
            // 检查是否有保存的壁纸
            const savedBackground = localStorage.getItem('backgroundImage');
            const savedIndex = localStorage.getItem('backgroundIndex');
            
            if (savedBackground) {
                // 使用保存的壁纸
                document.body.style.backgroundImage = savedBackground;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
                document.body.style.backgroundAttachment = 'fixed';
                if (savedIndex) {
                    currentWallpaperIndex = parseInt(savedIndex);
                }
            } else {
                // 使用默认壁纸
                document.body.style.backgroundImage = `url('${defaultWallpapers[0].url}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
                document.body.style.backgroundAttachment = 'fixed';
            }
            
            // 异步获取 Bing 壁纸（不影响初始显示）
            fetchBingWallpapers().then(() => {
                if (bingWallpapers.length > 0) {
                    console.log('Bing 壁纸加载成功，共', bingWallpapers.length, '张');
                }
            }).catch(error => {
                console.log('使用默认壁纸');
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            init();
        });

        // 点击页面其他地方关闭搜索引擎下拉框
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('engineDropdown');
            const engineIcon = document.getElementById('currentEngineDisplay');
            if (dropdown && !engineIcon.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    </script>
